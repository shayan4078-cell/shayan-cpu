<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | SHAYAN.CPU</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#070b12;
    color:white;
    text-align:center;
}

.container{
    max-width:600px;
    margin:50px auto;
    padding:30px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:20px;
}

h1{
    color:#00aaff;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#070b12;
    color:white;
    font-size:16px;
    outline:1px solid #333;
}

textarea{
    height:120px;
    resize:none;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#008cff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#00aaff;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#00aaff;
    text-decoration:none;
}

</style>

</head>


<body>


<div class="container">

<h1>🛒 ثبت سفارش</h1>

<p>لطفاً اطلاعات خود را وارد کنید.</p>


<input
type="text"
id="name"
placeholder="نام و نام خانوادگی"
>


<input
type="tel"
id="phone"
placeholder="شماره تماس"
>


<textarea
id="address"
placeholder="آدرس کامل"
></textarea>


<textarea
id="note"
placeholder="توضیحات سفارش (اختیاری)"
></textarea>


<button
type="button"
onclick="sendOrder()"
>
ارسال سفارش در واتساپ
</button>


<a
class="back"
href="lavazem.html"
>بازگشت به فروشگاه
</a>


</div>



<script>

function sendOrder(){

    let name = document.getElementById("name").value.trim();

    let phone = document.getElementById("phone").value.trim();

    let address = document.getElementById("address").value.trim();

    let note = document.getElementById("note").value.trim();


    if(name === ""  phone === ""  address === ""){

        alert("لطفاً نام، شماره تماس و آدرس را وارد کنید.");

        return;

    }


    // شماره واتساپ SHAYAN.CPU
    let whatsapp = "989012384436";


    let message =
        "سلام SHAYAN.CPU\n\n" +
        "🛒 سفارش جدید\n\n" +
        ":bust_in_silhouette: نام: " + name + "\n" +
        ":telephone_receiver: شماره تماس: " + phone + "\n" +
        ":round_pushpin: آدرس: " + address + "\n" +
        ":memo: توضیحات: " + note;


    let url =
        "https://wa.me/" +
        whatsapp +
        "?text=" +
        encodeURIComponent(message);


    window.location.href = url;

}

</script>


</body>

</html>
