<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | SHAYAN.CPU</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#070b12;
    color:white;
    text-align:center;
}

.container{
    max-width:600px;
    margin:40px auto;
    padding:30px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:20px;
}

h1{
    color:#00aaff;
}

input,
textarea,
select{
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#070b12;
    color:white;
    font-size:16px;
}

textarea{
    height:110px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

</style>
</head>

<body>

<div class="container">

<h1>🛒 ثبت سفارش</h1>

<p>اطلاعات سفارش خود را وارد کنید</p>


<input
type="text"
id="product"
placeholder="نام محصول"
>


<input
type="number"
id="price"
placeholder="قیمت محصول"
>


<input
type="number"
id="quantity"
value="1"
min="1"
placeholder="تعداد"
>


<input
type="text"
id="name"
placeholder="نام و نام خانوادگی"
>


<input
type="tel"
id="phone"
placeholder="شماره تماس"
>
<textarea
id="address"
placeholder="آدرس کامل"
></textarea>


<textarea
id="note"
placeholder="توضیحات سفارش (اختیاری)"
></textarea>


<button type="button" onclick="sendOrder()">
:iphone: ارسال سفارش در واتساپ
</button>

</div>


<script>

function sendOrder(){

    let product =
        document.getElementById("product").value.trim();

    let price =
        document.getElementById("price").value.trim();

    let quantity =
        document.getElementById("quantity").value.trim();

    let name =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let address =
        document.getElementById("address").value.trim();

    let note =
        document.getElementById("note").value.trim();


    if(
        product === "" ||
        price === "" ||
        quantity === "" ||
        name === "" ||
        phone === "" ||
        address === ""
    ){

        alert("لطفاً تمام اطلاعات ضروری را وارد کنید.");

        return;

    }


    let total =
        Number(price) * Number(quantity);


    let message =
        "سلام SHAYAN.CPU :wave:\n\n" +

        "🛒 سفارش جدید\n" +
        "━━━━━━━━━━━━━━\n\n" +

        ":package: محصول: " + product + "\n" +

        ":moneybag: قیمت واحد: " +
        Number(price).toLocaleString("fa-IR") +
        " تومان\n" +

        ":1234: تعداد: " + quantity + "\n" +

        ":dollar: مبلغ کل: " +
        total.toLocaleString("fa-IR") +
        " تومان\n\n" +

        ":bust_in_silhouette: نام: " + name + "\n" +

        ":telephone_receiver: شماره تماس: " + phone + "\n\n" +

        ":round_pushpin: آدرس:\n" +
        address + "\n\n" +

        ":memo: توضیحات:\n" +
        (note === "" ? "ندارد" : note) +

        "\n\n━━━━━━━━━━━━━━\n" +

        "SHAYAN.CPU";


    let url =
        "https://wa.me/989012384436?text=" +
        encodeURIComponent(message);


    window.open(url, "_blank");

}

</script>

</body>
</html>
