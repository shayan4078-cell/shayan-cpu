<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | SHAYAN.CPU</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#070b12;
    color:white;
    text-align:center;
}

.container{
    width:90%;
    max-width:500px;
    margin:40px auto;
    padding:25px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:15px;
}

h1{
    color:#00aaff;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin:8px 0;
    box-sizing:border-box;
    border:0;
    border-radius:10px;
    font-family:Tahoma;
}

textarea{
    height:100px;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    background:#008cff;
    color:white;
    border:0;
    border-radius:10px;
    font-family:Tahoma;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>ثبت سفارش</h1>

<p>SHAYAN.CPU</p>

<input
id="name"
type="text"
placeholder="نام و نام خانوادگی"
>
<input
id="phone"
type="tel"
placeholder="شماره تماس"
>

<textarea
id="address"
placeholder="آدرس کامل"
></textarea>

<textarea
id="note"
placeholder="توضیحات سفارش"
></textarea>

<button type="button" onclick="sendOrder()">
ثبت سفارش در واتساپ
</button>

</div>


<script>

function sendOrder(){

let name = document.getElementById("name").value.trim();

let phone = document.getElementById("phone").value.trim();

let address = document.getElementById("address").value.trim();

let note = document.getElementById("note").value.trim();


if(name === ""  phone === ""  address === ""){

alert("لطفاً نام، شماره تماس و آدرس را وارد کنید.");

return;

}


/* شماره واتساپ خودت را اینجا وارد کن */

let whatsapp = "989012384436";


let message =
"سلام SHAYAN.CPU\n\n" +
"سفارش جدید\n\n" +
"نام: " + name + "\n" +
"شماره تماس: " + phone + "\n" +
"آدرس: " + address + "\n" +
"توضیحات: " + note;


let url =
"https://wa.me/" +
whatsapp +
"?text=" +
encodeURIComponent(message);


window.location.href = url;

}

</script>

</body>

</html>
