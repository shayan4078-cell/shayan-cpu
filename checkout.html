<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت سفارش | SHAYAN.CPU</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#070b12;color:white}
.container{max-width:650px;margin:30px auto;padding:25px}.box{background:#101722;border:1px solid #008cff;border-radius:18px;padding:25px;margin-bottom:20px}
h1{text-align:center;color:#00aaff}h2{color:#00aaff}.product{padding:15px 0;border-bottom:1px solid #333}.product:last-child{border-bottom:0}
.total{color:#00ff88;font-size:22px;font-weight:bold;margin-top:20px}input,textarea{width:100%;margin:8px 0;padding:15px;border:0;border-radius:10px;background:#070b12;color:white;font-size:16px}
textarea{height:110px;resize:none}button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:10px;background:#25D366;color:white;font-size:18px;cursor:pointer}
.back{display:block;text-align:center;color:#00aaff;margin-top:20px;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="box"><h1>🛒 ثبت سفارش</h1><div id="orderProducts">در حال بارگذاری سفارش...</div><div class="total" id="total">جمع: 0 تومان</div></div>
<div class="box"><h2>👤 اطلاعات مشتری</h2>
<input type="text" id="name" placeholder="نام و نام خانوادگی">
<input type="tel" id="phone" placeholder="شماره تماس">
<textarea id="address" placeholder="آدرس کامل"></textarea>
<textarea id="note" placeholder="توضیحات سفارش (اختیاری)"></textarea>
<button type="button" onclick="sendOrder()">📱 ارسال سفارش در واتساپ</button>
<a href="lavazem.html" class="back">← بازگشت به فروشگاه</a>
</div></div>
<script>
let cart=JSON.parse(localStorage.getItem("cart"))||[];
function showOrder(){let box=document.getElementById("orderProducts"),total=document.getElementById("total");box.innerHTML="";if(cart.length===0){box.innerHTML="<p>سبد خرید شما خالی است.</p>";total.innerHTML="جمع: 0 تومان";return}let sum=0;cart.forEach(function(product){let productTotal=Number(product.price)*Number(product.quantity);sum+=productTotal;box.innerHTML+=`<div class="product"><strong>${product.name}</strong><br>تعداد: ${product.quantity}<br>قیمت واحد: ${Number(product.price).toLocaleString()} تومان<br>مبلغ: ${productTotal.toLocaleString()} تومان</div>`});total.innerHTML="جمع کل: "+sum.toLocaleString()+" تومان"}
function sendOrder(){
if(cart.length===0){alert("سبد خرید شما خالی است.");return}
let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),note=document.getElementById("note").value.trim();
if(name===""||phone===""||address===""){alert("لطفاً نام، شماره تماس و آدرس را وارد کنید.");return}
let message="سلام SHAYAN.CPU 👋

🛒 سفارش جدید
━━━━━━━━━━━━━━

",total=0;
cart.forEach(function(product,index){let productTotal=Number(product.price)*Number(product.quantity);total+=productTotal;message+="📦 محصول "+(index+1)+": "+product.name+"
🔢 تعداد: "+product.quantity+"
💰 قیمت واحد: "+Number(product.price).toLocaleString()+" تومان
💵 مبلغ: "+productTotal.toLocaleString()+" تومان

"});
message+="━━━━━━━━━━━━━━
💰 مبلغ کل: "+total.toLocaleString()+" تومان

👤 نام: "+name+"
📞 شماره تماس: "+phone+"

📍 آدرس:
"+address+"

📝 توضیحات:
"+(note===""?"ندارد":note);
let url="https://wa.me/989012384436?text="+encodeURIComponent(message);window.open(url,"_blank")
}
showOrder();
</script>
</body>
</html>
