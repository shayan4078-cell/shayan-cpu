<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | SHAYAN.CPU</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#070b12;
    color:white;
    text-align:center;
}

.container{
    max-width:650px;
    margin:40px auto;
    padding:25px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:20px;
}

h1{
    color:#00aaff;
}

#order{
    margin:20px 0;
    padding:15px;
    background:#070b12;
    border-radius:12px;
    text-align:right;
}
.product{
    padding:12px;
    margin:8px 0;
    border-bottom:1px solid #333;
}

.total{
    color:#00ff88;
    font-size:20px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    margin:8px 0;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#070b12;
    color:white;
    font-size:16px;
}

textarea{
    height:110px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.back{
    display:block;
    margin-top:20px;
    color:#00aaff;
    text-decoration:none;
}

</style>

</head>


<body>


<div class="container">

<h1>🛒 ثبت سفارش</h1>


<div id="order">

<h2>محصولات سفارش</h2>

<div id="products">
در حال بارگذاری...
</div>

<div class="total" id="total">
جمع: 0 تومان
</div>

</div>


<input
type="text"
id="name"
placeholder="نام و نام خانوادگی"
>


<input
type="tel"
id="phone"
placeholder="شماره تماس"
>


<textarea
id="address"
placeholder="آدرس کامل"
></textarea>


<textarea
id="note"
placeholder="توضیحات سفارش (اختیاری)"
></textarea>
<button
type="button"
onclick="sendOrder()"
>
:iphone: ارسال سفارش در واتساپ
</button>


<a
href="lavazem.html"
class="back"
>
بازگشت به فروشگاه
</a>


</div>



<script>


let cart =
JSON.parse(localStorage.getItem("cart")) || [];


function showOrder(){

    let products =
        document.getElementById("products");

    let total =
        document.getElementById("total");


    products.innerHTML = "";

    let sum = 0;


    if(cart.length === 0){

        products.innerHTML =
            "<p>سبد خرید خالی است.</p>";

        total.innerHTML =
            "جمع: 0 تومان";

        return;

    }


    cart.forEach(function(product){

        products.innerHTML +=

        "<div class='product'>" +

        "<b>" +
        product.name +
        "</b><br>" +

        "قیمت: " +
        product.price.toLocaleString() +
        " تومان" +

        "</div>";


        sum += Number(product.price);

    });


    total.innerHTML =
        "جمع: " +
        sum.toLocaleString() +
        " تومان";

}


function sendOrder(){

    if(cart.length === 0){

        alert("سبد خرید شما خالی است.");

        return;

    }


    let name =
        document.getElementById("name").value.trim();


    let phone =
        document.getElementById("phone").value.trim();


    let address =
        document.getElementById("address").value.trim();


    let note =
        document.getElementById("note").value.trim();


    if(
        name === "" ||
        phone === "" ||
        address === ""
    ){

        alert(
            "لطفاً نام، شماره تماس و آدرس را وارد کنید."
        );

        return;

    }
let message =
        "سلام SHAYAN.CPU :wave:\n\n" +

        "🛒 سفارش جدید\n" +
        "━━━━━━━━━━━━━━\n\n";


    let total = 0;


    cart.forEach(function(product,index){

        message +=

            (index + 1) +
            ". " +
            product.name +
            " - " +
            Number(product.price).toLocaleString() +
            " تومان\n";


        total += Number(product.price);

    });


    message +=

        "\n:moneybag: مبلغ کل: " +
        total.toLocaleString() +
        " تومان\n\n" +

        ":bust_in_silhouette: نام: " +
        name +
        "\n" +

        ":telephone_receiver: شماره تماس: " +
        phone +
        "\n\n" +

        ":round_pushpin: آدرس:\n" +
        address +
        "\n\n" +

        ":memo: توضیحات:\n" +
        (note === "" ? "ندارد" : note);


    let url =
        "https://wa.me/989012384436?text=" +
        encodeURIComponent(message);


    window.open(url,"_blank");

}


showOrder();

</script>


</body>

</html>
