<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | SHAYAN.CPU</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#070b12;
    color:white;
    text-align:center;
}

.container{
    max-width:600px;
    margin:50px auto;
    padding:30px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:20px;
}

h1{
    color:#00aaff;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    margin:10px 0;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#070b12;
    color:white;
    font-size:16px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#008cff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.whatsapp{
    display:block;
    margin-top:15px;
    padding:15px;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<h1>🛒 ثبت سفارش</h1>

<input
type="text"
id="name"
placeholder="نام و نام خانوادگی"
>

<input
type="tel"
id="phone"
placeholder="شماره تماس"
>

<textarea
id="address"
placeholder="آدرس کامل"
></textarea>

<textarea
id="note"
    placeholder="توضیحات سفارش"
></textarea>


<button type="button" onclick="testOrder()">
ارسال سفارش
</button>


<a
class="whatsapp"
href="https://wa.me/989012384436"
target="_blank"
>
:speech_balloon: تست واتساپ
</a>

</div>


<script>

function testOrder(){

    let name = document.getElementById("name").value;

    let phone = document.getElementById("phone").value;

    let address = document.getElementById("address").value;

    let note = document.getElementById("note").value;


    if(name === ""  phone === ""  address === ""){

        alert("لطفاً نام، شماره تماس و آدرس را وارد کنید.");

        return;

    }


    let message =
        "سلام SHAYAN.CPU%0A%0A" +
        "🛒 سفارش جدید%0A%0A" +
        "نام: " + encodeURIComponent(name) + "%0A" +
        "شماره تماس: " + encodeURIComponent(phone) + "%0A" +
        "آدرس: " + encodeURIComponent(address) + "%0A" +
        "توضیحات: " + encodeURIComponent(note);


    window.open(
        "https://wa.me/989012384436?text=" + message,
        "_blank"
    );

}

</script>

</body>
</html>
