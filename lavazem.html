<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوازم جانبی | SHAYAN.CPU</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#070b12;
    color:white;
    text-align:center;
}

h1{
    color:#00aaff;
    margin-top:40px;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    width:250px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:15px;
    padding:15px;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
}

.price{
    color:#00ff88;
    font-size:20px;
}

button{
    background:#008cff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#00aaff;
}

#cart{
    margin:30px auto;
    padding:20px;
    max-width:700px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:15px;
}

.checkout{
    display:inline-block;
    margin-top:20px;
    padding:14px 25px;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.remove{
    background:#e53935;
    margin-right:10px;
}

</style>

</head>


<body>


<h1>🛍️ لوازم جانبی موبایل</h1>


<div class="products">


<div class="card">

<img src="charger.jpg" alt="شارژر فست">

<h2>شارژر فست</h2>

<p class="price">500000 تومان</p>

<button onclick="addToCart('شارژر فست',500000)">
افزودن به سبد خرید
</button>

</div>



<div class="card">

<img src="cable.jpg" alt="کابل شارژ">

<h2>کابل شارژ</h2>

<p class="price">200000 تومان</p>

<button onclick="addToCart('کابل شارژ',200000)">
افزودن به سبد خرید
</button>

</div>



<div class="card">

<img src="case.jpg" alt="قاب موبایل">

<h2>قاب موبایل</h2>

<p class="price">300000 تومان</p>
<button onclick="addToCart('قاب موبایل',300000)">
افزودن به سبد خرید
</button>

</div>


</div>



<div id="cart">

<h2>🛒 سبد خرید</h2>

<div id="cartItems">
سبد خرید خالی است
</div>

<h3 id="total">
جمع: 0 تومان
</h3>

<a
href="checkout.html"
class="checkout"
>
ادامه و ثبت سفارش
</a>

</div>



<script>

let cart = [];


function addToCart(name,price){

    cart.push({
        name:name,
        price:price
    });

    showCart();

}


function removeFromCart(index){

    cart.splice(index,1);

    showCart();

}


function showCart(){

    let items =
        document.getElementById("cartItems");

    let total =
        document.getElementById("total");

    items.innerHTML = "";

    let sum = 0;


    if(cart.length === 0){

        items.innerHTML =
            "سبد خرید خالی است";

        total.innerHTML =
            "جمع: 0 تومان";

        return;

    }


    cart.forEach(function(product,index){

        items.innerHTML +=

        "<p>" +

        product.name +

        " - " +

        product.price.toLocaleString() +

        " تومان " +

        "<button class='remove' onclick='removeFromCart(" +

        index +

        ")'>حذف</button>" +

        "</p>";

        sum += product.price;

    });


    total.innerHTML =
        "جمع: " +
        sum.toLocaleString() +
        " تومان";

}

</script>


</body>

</html>
