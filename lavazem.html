<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوازم جانبی | SHAYAN.CPU</title>


<style>

body{
    margin:0;
    font-family:Tahoma;
    background:#070b12;
    color:white;
    text-align:center;
}


h1,h2{
    color:#00aaff;
}


.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}


.card{
    width:250px;
    background:#101722;
    border:1px solid #008cff;
    border-radius:15px;
    padding:15px;
}


.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
}


.price{
    color:#00ff88;
    font-size:20px;
}


button{
    background:#008cff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}


#cart{
    margin:30px;
    padding:20px;
    background:#101722;
    border-radius:15px;
}


</style>

</head>
<body>


<h1>لوازم جانبی موبایل</h1>


<div class="products">


<div class="card">

<img src="charger.jpg">

<h2>شارژر فست</h2>

<p class="price">500000 تومان</p>

<button onclick="addToCart('شارژر فست',500000)">
افزودن به سبد خرید
</button>

</div>



<div class="card">

<img src="cable.jpg">

<h2>کابل شارژ</h2>

<p class="price">200000 تومان</p>

<button onclick="addToCart('کابل شارژ',200000)">
افزودن به سبد خرید
</button>

</div>




<div class="card">

<img src="case.jpg">

<h2>قاب موبایل</h2>

<p class="price">300000 تومان</p>

<button onclick="addToCart('قاب موبایل',300000)">
افزودن به سبد خرید
</button>

</div>


</div>



<div id="cart">

<h2>🛒 سبد خرید</h2>


<div id="cartItems">
    سبد خرید خالی است
</div>


<h3 id="total">
جمع: 0 تومان
</h3>


</div>



<script>


let cart=[];


function addToCart(name,price){


cart.push({

name:name,

price:price

});


showCart();


}



function showCart(){


let items=document.getElementById("cartItems");

let total=document.getElementById("total");


items.innerHTML="";


let sum=0;



cart.forEach(function(product,index){


items.innerHTML += 
"<p>"+product.name+" - "+product.price.toLocaleString()+" تومان</p>";


sum += product.price;


});



if(cart.length==0){

items.innerHTML="سبد خرید خالی است";

}



total.innerHTML="جمع: "+sum.toLocaleString()+" تومان";


}


</script>



</body>

</html>
